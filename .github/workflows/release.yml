name: Release

# Wird ausgelöst, wenn ein Versions-Tag wie "v1.0.0" gepusht wird.
# Baut die Mod und hängt die .jar an ein GitHub-Release an.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        # Version aus dem Tag übernehmen (v1.2.3 -> 1.2.3)
        run: ./gradlew build -Pmod_version=${GITHUB_REF_NAME#v} --stacktrace

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Support Blocks ${{ github.ref_name }}
          files: build/libs/*.jar
          generate_release_notes: true
          body: |
            Client-Mod für **Minecraft 1.21.1** mit **NeoForge 21.1.x**.

            **Installation:** Die `.jar` unten herunterladen und in den Ordner `.minecraft/mods` kopieren.
            Auf dem Server ist die Mod nicht nötig.
