// NeoForge-MDK-Setup für Minecraft 1.21.1 (ModDevGradle, Java 21).
plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.115'
}

version = mod_version
group = 'com.supportblocks'
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Jar: Version ins Manifest schreiben und Lizenztext mitpacken
tasks.named('jar') {
    // Wird in neoforge.mods.toml über ${file.jarVersion} als Mod-Version gelesen
    manifest {
        attributes 'Implementation-Version': project.version
    }
    from('LICENSE') {
        rename { "${it}_${mod_id}" }
    }
}
